# Method parameter comment rule
java.comment.MethodParamCommentRule.rule.msg=Method parameter comments must include parameter type information
java.comment.MethodParamCommentRule.rule.desc=Each method parameter should be documented with its type information in parentheses, followed by a description
java.comment.MethodParamCommentRule.violation.msg=Parameter [{0}] comment should include type information in parentheses

# Constant naming rule
java.naming.ConstantNameShouldContainTypeRule.rule.msg=Constant names should include their data type as a suffix
java.naming.ConstantNameShouldContainTypeRule.rule.desc=Constant names should end with their data type (e.g., MAX_COUNT_INT, MIN_VALUE_DOUBLE)
java.naming.ConstantNameShouldContainTypeRule.violation.msg=Constant [{0}] should end with type suffix [{1}]