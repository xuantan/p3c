# Method parameter comment rule
java.comment.MethodParamCommentRule.rule.msg=方法参数注释必须包含参数类型信息
java.comment.MethodParamCommentRule.rule.desc=每个方法参数都应该在注释中包含其类型信息（用括号标注）和说明
java.comment.MethodParamCommentRule.violation.msg=参数 [{0}] 的注释应该包含括号中的类型信息

# Constant naming rule
java.naming.ConstantNameShouldContainTypeRule.rule.msg=常量命名应包含其数据类型作为后缀
java.naming.ConstantNameShouldContainTypeRule.rule.desc=常量名称应以其数据类型结尾（例如：MAX_COUNT_INT、MIN_VALUE_DOUBLE）
java.naming.ConstantNameShouldContainTypeRule.violation.msg=常量 [{0}] 应以类型后缀 [{1}] 结尾