java.comment.MethodParameterMustHaveJavadocRule.rule.msg=Method parameters must be documented with Javadoc @param tags
java.comment.MethodParameterMustHaveJavadocRule.rule.desc=All method parameters must be documented with Javadoc @param tags. Each parameter should have a clear description of its purpose and usage.
java.comment.MethodParameterMustHaveJavadocRule.violation.msg.missing=Method [{0}] has parameters but no Javadoc comment
java.comment.MethodParameterMustHaveJavadocRule.violation.msg.param=Parameter [{0}] in method [{1}] is not documented with @param tag